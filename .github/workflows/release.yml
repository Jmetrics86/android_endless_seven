name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.0.42)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        run: npm ci
        working-directory: web

      - name: Build Web Game Assets
        run: npm run build:android
        working-directory: web

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug

      - name: Determine Version and Prepare APK
        id: prep
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VER=$(grep 'versionName' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VER}"
          fi
          
          mkdir -p release-artifacts
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          APK_TARGET="release-artifacts/endless-seven-${TAG}.apk"
          
          if [ -f "$APK_SOURCE" ]; then
            cp "$APK_SOURCE" "$APK_TARGET"
            cp "$APK_SOURCE" "release-artifacts/endless-seven-debug-latest.apk"
            echo "Copied $APK_SOURCE -> $APK_TARGET"
          else
            echo "Error: APK not found at $APK_SOURCE"
            exit 1
          fi
          
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "apk_path=${APK_TARGET}" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: endless-seven-apk-${{ steps.prep.outputs.tag }}
          path: release-artifacts/*
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: Endless Seven ${{ steps.prep.outputs.tag }}
          body: |
            ## Endless Seven ${{ steps.prep.outputs.tag }}
            
            ### 📦 Download APK
            - **[endless-seven-${{ steps.prep.outputs.tag }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag }}/endless-seven-${{ steps.prep.outputs.tag }}.apk)**
            
            ### Changes in this Release
            - Fully verified 42-card tactical card engine (`variant-2026-08-13`).
            - Real-time 3D Three.js tactical board resolution.
            - Automated combat lifecycle, haste strikes, ability step, and siege resolution.
          files: |
            release-artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
